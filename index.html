<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Diver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #001a33; }
  canvas { display: block; cursor: crosshair; }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180,230,255,0.7);
    font: 15px/1 sans-serif;
    pointer-events: none;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Move your mouse (or finger) to guide the diver</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- helpers ---
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

// --- diver state ---
const diver = {
  x: 0, y: 0,
  tx: 0, ty: 0,
  facingRight: true,
  wobble: 0
};

function setTarget(x, y) { diver.tx = x; diver.ty = y; }

canvas.addEventListener('mousemove', e => setTarget(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  setTarget(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  setTarget(e.touches[0].clientX, e.touches[0].clientY);
  document.getElementById('hint').style.opacity = '0';
}, { passive: true });
canvas.addEventListener('mousemove', () => {
  document.getElementById('hint').style.opacity = '0';
}, { once: true });

// --- bubbles ---
const bubbles = [];
let bubbleTimer = 0;

function spawnBubble() {
  const side = diver.facingRight ? 1 : -1;
  bubbles.push({
    x: diver.x + side * 28,
    y: diver.y - 2,
    r: Math.random() * 5 + 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: -(Math.random() * 0.8 + 0.5),
    alpha: 0.85,
    phase: Math.random() * Math.PI * 2
  });
}

// --- plankton ---
const plankton = [];
for (let i = 0; i < 25; i++) {
  plankton.push({
    x: Math.random() * 2000,
    y: Math.random() * 1200,
    r: Math.random() * 2.5 + 0.5,
    spd: Math.random() * 0.25 + 0.05,
    a: Math.random() * 0.45 + 0.15
  });
}

// --- fish ---
const fishes = [
  { x: canvas.width * 0.2, baseY: canvas.height * 0.35, dir: 1,  speed: 0.7, size: 1,   body: '#FF8C1A', fin: '#E05A00', stripe: '#FFFFFF', phase: 0 },
  { x: canvas.width * 0.8, baseY: canvas.height * 0.55, dir: -1, speed: 0.5, size: 1.2, body: '#FFD21F', fin: '#1E78D6', stripe: '#1E78D6', phase: 2 }
];

function updateFish(f) {
  f.x += f.dir * f.speed;
  f.phase += 0.05;
  const margin = 60 * f.size;
  if (f.x > canvas.width - margin) f.dir = -1;
  if (f.x < margin) f.dir = 1;
  f.baseY = Math.min(f.baseY, canvas.height - 150);
}

function drawFish(f) {
  const y = f.baseY + Math.sin(f.phase * 0.7) * 10;
  const wag = Math.sin(f.phase * 3) * 0.35;
  ctx.save();
  ctx.translate(f.x, y);
  ctx.scale(f.dir * f.size, f.size);

  // tail (wiggles)
  ctx.save();
  ctx.translate(-22, 0);
  ctx.rotate(wag);
  ctx.fillStyle = f.fin;
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.lineTo(-16, -13);
  ctx.lineTo(-16, 13);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // top and bottom fins
  ctx.fillStyle = f.fin;
  ctx.beginPath();
  ctx.moveTo(-8, -12); ctx.lineTo(4, -20); ctx.lineTo(10, -11);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-2, 11); ctx.lineTo(6, 18); ctx.lineTo(10, 10);
  ctx.closePath(); ctx.fill();

  // body
  ctx.fillStyle = f.body;
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 14, 0, 0, Math.PI * 2); ctx.fill();

  // stripe
  ctx.fillStyle = f.stripe;
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(-3, 0, 4, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // eye
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(14, -3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(15, -3, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// --- coral helper ---
function coral(cx, cy, col, sz) {
  ctx.fillStyle = col;
  // centre stalk
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy);
  ctx.lineTo(cx + 4, cy);
  ctx.lineTo(cx + 3, cy - sz);
  ctx.lineTo(cx - 3, cy - sz);
  ctx.closePath();
  ctx.fill();
  // left branch
  ctx.beginPath();
  ctx.moveTo(cx - 1, cy - sz * 0.45);
  ctx.lineTo(cx - 1 + 2, cy - sz * 0.45);
  ctx.lineTo(cx - sz * 0.38 + 3, cy - sz * 0.88);
  ctx.lineTo(cx - sz * 0.38, cy - sz * 0.88);
  ctx.closePath();
  ctx.fill();
  // right branch
  ctx.beginPath();
  ctx.moveTo(cx + 1, cy - sz * 0.35);
  ctx.lineTo(cx + 3, cy - sz * 0.35);
  ctx.lineTo(cx + sz * 0.38 + 3, cy - sz * 0.82);
  ctx.lineTo(cx + sz * 0.38, cy - sz * 0.82);
  ctx.closePath();
  ctx.fill();
  // tips
  [[cx, cy - sz], [cx - sz*0.38+1, cy - sz*0.88], [cx + sz*0.38+2, cy - sz*0.82]].forEach(([tx,ty]) => {
    ctx.beginPath(); ctx.arc(tx, ty, sz * 0.12 + 3, 0, Math.PI*2); ctx.fill();
  });
}

// --- draw background ---
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0,   '#0082c8');
  g.addColorStop(0.35,'#005a96');
  g.addColorStop(1,   '#001830');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // light rays
  ctx.save();
  const nRays = 7;
  for (let i = 0; i < nRays; i++) {
    const rx = (canvas.width / nRays) * i + canvas.width / (nRays * 2);
    const rg = ctx.createLinearGradient(rx, 0, rx + 80, canvas.height * 0.72);
    rg.addColorStop(0, 'rgba(120,210,255,0.09)');
    rg.addColorStop(1, 'rgba(120,210,255,0)');
    ctx.beginPath();
    ctx.moveTo(rx - 25, 0);
    ctx.lineTo(rx + 90, canvas.height * 0.72);
    ctx.lineTo(rx + 65, canvas.height * 0.72);
    ctx.lineTo(rx - 50, 0);
    ctx.fillStyle = rg;
    ctx.fill();
  }
  // surface shimmer
  ctx.fillStyle = 'rgba(160,235,255,0.18)';
  ctx.fillRect(0, 0, canvas.width, 7);
  ctx.fillStyle = 'rgba(160,235,255,0.09)';
  ctx.fillRect(0, 7, canvas.width, 5);
  ctx.restore();
}

// --- draw seabed ---
function drawSeabed() {
  const by = canvas.height - 55;
  ctx.save();
  const sg = ctx.createLinearGradient(0, by, 0, canvas.height);
  sg.addColorStop(0, '#8B7355');
  sg.addColorStop(1, '#4A3520');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height);
  ctx.lineTo(0, by + 22);
  for (let x = 0; x <= canvas.width; x += 35)
    ctx.lineTo(x, by + Math.sin(x * 0.04) * 9 + 22);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.closePath();
  ctx.fill();

  // corals, evenly spaced
  const cols = ['#FF5555','#FF8C42','#FF5599','#FF7722','#FF4488'];
  for (let i = 0; i < 6; i++) {
    const cx = canvas.width * (i + 0.5) / 6;
    coral(cx, by + 18, cols[i % cols.length], 28 + (i % 3) * 8);
  }
  ctx.restore();
}

// --- draw plankton ---
function drawPlankton() {
  plankton.forEach(p => {
    p.x -= p.spd;
    if (p.x < -10) { p.x = canvas.width + 10; p.y = Math.random() * canvas.height * 0.9; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(160,230,255,${p.a})`;
    ctx.fill();
  });
}

// --- draw bubbles ---
function drawBubbles(t) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.x += b.vx + Math.sin(b.phase + t * 0.001) * 0.4;
    b.y += b.vy;
    b.alpha -= 0.0028;
    if (b.alpha <= 0 || b.y < -20) { bubbles.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.strokeStyle = 'rgba(200,240,255,0.95)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(b.x - b.r*0.28, b.y - b.r*0.28, b.r*0.38, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// --- draw Santa diver ---
function drawDiver(x, y, right, wb) {
  ctx.save();
  ctx.translate(x, y);
  if (!right) ctx.scale(-1, 1);

  const bk = Math.sin(wb) * 2.5; // gentle bob

  // == AIR TANK (behind body) ==
  ctx.fillStyle = '#8899AA';
  rr(-28, -20 + bk, 13, 38, 5); ctx.fill();
  ctx.fillStyle = '#BBCCDD';
  rr(-26, -16 + bk, 9, 10, 3); ctx.fill();
  ctx.fillStyle = '#556677';
  ctx.fillRect(-24, -24 + bk, 5, 6);

  // == BODY ==
  ctx.fillStyle = '#CC1100';
  ctx.beginPath();
  ctx.ellipse(0, 5 + bk, 20, 27, 0, 0, Math.PI * 2);
  ctx.fill();

  // belt
  ctx.fillStyle = '#F0EEE8';
  ctx.fillRect(-18, 9 + bk, 36, 8);
  ctx.fillStyle = '#DAA520';
  ctx.fillRect(-5, 10 + bk, 10, 6);
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 1;
  ctx.strokeRect(-5, 10 + bk, 10, 6);

  // == FINS ==
  function fin(sx, flip) {
    ctx.save();
    ctx.translate(sx, 30 + bk);
    ctx.rotate(flip * 0.18);
    ctx.fillStyle = '#CC1100';
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#AA0800';
    ctx.beginPath(); ctx.ellipse(0, 14, 11, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  fin(-9, -1); fin(9, 1);

  // == ARMS ==
  function arm(ax, ay, angle) {
    ctx.save();
    ctx.translate(ax, ay + bk);
    ctx.rotate(angle);
    ctx.fillStyle = '#CC1100';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 19, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F0EEE8';
    ctx.beginPath(); ctx.ellipse(0, 15, 8, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1A1A1A';
    ctx.beginPath(); ctx.ellipse(0, 19, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  arm(19, -3,  0.45);
  arm(-19, -1, -0.35);

  // collar trim
  ctx.fillStyle = '#F0EEE8';
  ctx.beginPath(); ctx.ellipse(0, -19 + bk, 18, 7, 0, 0, Math.PI*2); ctx.fill();

  // == HEAD ==
  ctx.fillStyle = '#FFCC99';
  ctx.beginPath(); ctx.arc(0, -30 + bk, 18, 0, Math.PI*2); ctx.fill();

  // santa hat
  ctx.fillStyle = '#CC1100';
  ctx.beginPath();
  ctx.moveTo(-16, -38 + bk);
  ctx.lineTo(16,  -38 + bk);
  ctx.lineTo(9,   -64 + bk);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#F0EEE8';
  ctx.beginPath(); ctx.ellipse(0, -38 + bk, 17, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(8, -64 + bk, 5, 0, Math.PI*2); ctx.fill();

  // SCUBA mask
  ctx.fillStyle = '#1A3A5C';
  rr(-14, -38 + bk, 28, 12, 4); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2;
  rr(-14, -38 + bk, 28, 12, 4); ctx.stroke();
  ctx.fillStyle = 'rgba(80,170,255,0.38)';
  rr(-12, -37 + bk, 24, 9, 3); ctx.fill();
  // strap
  ctx.strokeStyle = '#1A3A5C'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-14, -33 + bk); ctx.lineTo(-22, -29 + bk); ctx.stroke();

  // white beard
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(0, -17 + bk, 15, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-10, -11 + bk, 8,  0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(  0,  -9 + bk, 9,  0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 10, -12 + bk, 7,  0, Math.PI*2); ctx.fill();
  // moustache
  ctx.fillStyle = '#EEEEEE';
  ctx.beginPath(); ctx.ellipse(-5, -24 + bk, 7, 3.5, -0.25, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5, -24 + bk, 7, 3.5,  0.25, 0, Math.PI*2); ctx.fill();

  // regulator hose + mouthpiece
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(13, -24 + bk);
  ctx.quadraticCurveTo(22, -18 + bk, 27, -13 + bk);
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(27, -11 + bk, 6, 4, 0.3, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

// --- init diver position after first resize ---
diver.x  = diver.tx = canvas.width  / 2;
diver.y  = diver.ty = canvas.height / 2;

// --- main loop ---
let lastT = 0;
function loop(ts) {
  const dt = Math.min(ts - lastT, 50);
  lastT = ts;

  // smooth follow
  const dx = diver.tx - diver.x;
  const dy = diver.ty - diver.y;
  diver.x += dx * 0.055;
  diver.y += dy * 0.055;
  if (Math.abs(dx) > 2) diver.facingRight = dx > 0;

  diver.wobble += 0.04;

  bubbleTimer += dt;
  if (bubbleTimer > 280) { spawnBubble(); bubbleTimer = 0; }

  fishes.forEach(updateFish);

  drawBg();
  drawPlankton();
  fishes.forEach(drawFish);
  drawSeabed();
  drawBubbles(ts);
  drawDiver(diver.x, diver.y, diver.facingRight, diver.wobble);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
